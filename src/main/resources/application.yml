spring:
  application:
    name: media-backend
  
  datasource:
    url: jdbc:postgresql://postgres-db:5432/mediadb
    username: mediauser
    password: mediapass123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    com.media: DEBUG
    org.hibernate.SQL: DEBUG
